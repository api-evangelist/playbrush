name: Playbrush
description: >-
  Playbrush is a consumer oral-care technology brand that makes smart, gamified
  electric and sonic toothbrushes for children (ages 3+), pairing a Bluetooth-connected
  brush with a companion mobile app that turns brushing into interactive games and
  coaching to build good dental-hygiene habits. Founded as a UK/Austria startup and
  backed by Speedinvest, the Playbrush product line has since been acquired by
  SUNSTAR and is now sold under the GUM Playbrush brand; the former playbrush.com
  domain 302-redirects to a Sunstar GUM product page. Playbrush is a hardware/consumer-app
  company and exposes no public developer portal, API, specification, or /.well-known/
  discovery surface. This profile was surfaced as a Speedinvest portfolio company and
  added to the API Evangelist network as a lead; enrichment confirmed there is no API surface.
